name: Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v2.0.0"
        required: true

permissions:
  contents: write

# A partir da v2.0.0 a interface PADRAO e a Ink, compilada com "bun --compile"
# num executavel unico (sem Node no usuario final). O nucleo Go vai ao lado como
# "zapterm-core" (cerebro headless --ui=json; tambem e a UI classica tview).
# Tudo e construido num unico runner Ubuntu via cross-compile:
#   - nucleo Go: linux (nativo), windows (mingw), raspberrypi (arm gcc)
#   - UI Ink:    linux (bun), windows (bun --target=bun-windows-x64)
# Raspberry Pi (arm 32-bit) nao tem bun, entao recebe so o nucleo Go (tview).
jobs:
  # Descobre qual versao publicar e se ha o que publicar. Ao entrar codigo novo
  # no master (merge de PR), a versao vem do VERSION do main.go: se a tag dessa
  # versao ainda nao existir, a release sai sozinha; se ja existir, o job de
  # build e pulado (push de doc/hotfix no master nao republica nada).
  prepare:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.tag }}"
            ref="$version"
            publish=true
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
            ref="${{ github.ref }}"
            publish=true
          else
            # push no master: a versao e a do main.go (mesmo sed do release.sh)
            version="$(sed -n 's/^var VERSION string = "\(v[^"]*\)"$/\1/p' main.go | head -n1)"
            ref="${{ github.sha }}"
            if [ -z "$version" ]; then
              echo "Nao consegui ler a VERSION do main.go" >&2
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
              echo "A tag $version ja existe — nada a publicar."
              publish=false
            else
              publish=true
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "versao=$version publicar=$publish ref=$ref"

  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'

    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install cross toolchains and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 gcc-arm-linux-gnueabi zip

      - name: Install Ink dependencies
        working-directory: ink-ui
        run: npm ci

      - name: Build Go cores (linux, windows, raspberrypi)
        run: |
          mkdir -p build
          echo "==> linux amd64"
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o build/zapterm-core .
          echo "==> windows amd64 (mingw)"
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc \
            go build -trimpath -ldflags="-s -w" -o build/zapterm-core.exe .
          echo "==> raspberrypi (arm)"
          CGO_ENABLED=1 GOOS=linux GOARCH=arm GOARM=5 CC=arm-linux-gnueabi-gcc \
            go build -trimpath -ldflags="-s -w" -o build/zapterm-rpi .

      - name: Compile Ink UI bundles (linux, windows)
        working-directory: ink-ui
        run: |
          echo "==> Ink linux"
          bun build src/index.mjs --compile --outfile ../build/zapterm
          echo "==> Ink windows"
          bun build src/index.mjs --compile --target=bun-windows-x64 --outfile ../build/ZapTerm

      - name: Package assets
        run: |
          mkdir -p release-assets pkg
          chmod +x build/zapterm build/zapterm-core build/zapterm-rpi

          # Linux: Ink (padrao) + nucleo Go
          ldir="pkg/ZapTerm-linux"; mkdir -p "$ldir"
          cp build/zapterm "$ldir/zapterm"
          cp build/zapterm-core "$ldir/zapterm-core"
          cp packaging/linux/Abrir-ZapTerm.sh packaging/linux/Instalar-no-menu.sh \
             packaging/linux/Atualizar-ZapTerm.sh packaging/linux/LEIA-ME.txt "$ldir/"
          cp assets/zapterm.png "$ldir/"
          chmod +x "$ldir"/*.sh "$ldir/zapterm" "$ldir/zapterm-core"
          (cd pkg && zip -qr "../release-assets/ZapTerm-${RELEASE_VERSION}-linux.zip" ZapTerm-linux)

          # Raspberry Pi: so o nucleo Go (tview) como 'zapterm' (sem bun p/ arm)
          rdir="pkg/ZapTerm-raspberrypi"; mkdir -p "$rdir"
          cp build/zapterm-rpi "$rdir/zapterm"
          cp packaging/linux/Abrir-ZapTerm.sh packaging/linux/Instalar-no-menu.sh \
             packaging/linux/Atualizar-ZapTerm.sh packaging/linux/LEIA-ME.txt "$rdir/"
          cp assets/zapterm.png "$rdir/"
          chmod +x "$rdir"/*.sh "$rdir/zapterm"
          (cd pkg && zip -qr "../release-assets/ZapTerm-${RELEASE_VERSION}-raspberrypi.zip" ZapTerm-raspberrypi)

          # Windows: Ink (padrao) + nucleo Go
          wdir="pkg/ZapTerm-windows"; mkdir -p "$wdir"
          cp build/ZapTerm.exe "$wdir/ZapTerm.exe"
          cp build/zapterm-core.exe "$wdir/zapterm-core.exe"
          cp packaging/windows/Abrir-ZapTerm.bat packaging/windows/Instalar-no-menu-iniciar.bat \
             packaging/windows/Atualizar-ZapTerm.bat packaging/windows/LEIA-ME.txt "$wdir/"
          cp assets/zapterm.ico "$wdir/"
          (cd pkg && zip -qr "../release-assets/ZapTerm-${RELEASE_VERSION}-windows.zip" ZapTerm-windows)

          ls -lah release-assets

      - name: Generate release notes
        shell: bash
        run: |
          current_tag="${RELEASE_VERSION}"
          previous_tag="$(git tag --sort=-v:refname | grep -vx "$current_tag" | head -n1)"
          if [ -n "$previous_tag" ]; then
            git log "$previous_tag..HEAD" --no-decorate --pretty=format:'- %s' --abbrev-commit > changes.txt
          else
            git log --no-decorate --pretty=format:'- %s' --abbrev-commit > changes.txt
          fi
          if [ ! -s changes.txt ]; then
            echo "- Release $current_tag" > changes.txt
          fi

      # Quando a release sai de um push no master, a tag ainda nao existe: a
      # action a cria no commit deste run (target_commitish).
      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_VERSION }}
          body_path: changes.txt
          files: release-assets/*.zip
          draft: false
          prerelease: false
